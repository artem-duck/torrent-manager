services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    shm_size: "1gb"
    cpus: "1.0"
    mem_limit: 1536m
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=error
      - HEADLESS=true
      - BROWSER_TIMEOUT=90000
      - TZ=${APP_TIMEZONE:-Europe/Moscow}
    tmpfs:
      - /tmp:size=512M,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  torrent_manager:
    build: .
    container_name: torrent_manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${APP_TIMEZONE:-Europe/Moscow}
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
    depends_on:
      - flaresolverr
